name: Release

# <パッケージのディレクトリ名>-v<version> のタグで、そのパッケージを npm に公開する（例: code-lint-v0.1.0）
on:
  push:
    tags: ["*-v*"]

permissions:
  contents: read
  # npm の provenance（publishConfig.provenance）に使う
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: タグからパッケージを決め、package.json の version と一致することを確かめる
        id: package
        run: |
          dir="packages/${GITHUB_REF_NAME%-v*}"
          if [ ! -f "${dir}/package.json" ]; then
            echo "タグ ${GITHUB_REF_NAME} に対応するパッケージ ${dir} がありません" >&2
            exit 1
          fi
          version="$(node -p "require('./${dir}/package.json').version")"
          if [ "${GITHUB_REF_NAME##*-v}" != "${version}" ]; then
            echo "タグ ${GITHUB_REF_NAME} と ${dir}/package.json の version ${version} が一致しません" >&2
            exit 1
          fi
          echo "dir=${dir}" >>"$GITHUB_OUTPUT"
      - run: pnpm --filter "./${{ steps.package.outputs.dir }}" test
      # prepack で dist/ をビルドしてから公開する
      - run: pnpm --filter "./${{ steps.package.outputs.dir }}" publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
